services:
  db:
    image: postgres:17.6-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lixozero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
      POSTGRES_DB: ${POSTGRES_DB:-lixozero}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./api
    command: [npm, run, db:migrate]

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lixozero}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/${POSTGRES_DB:-lixozero}

    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api

    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-lixozero}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/${POSTGRES_DB:-lixozero}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./web

    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'

    environment:
      API_PROXY_TARGET: http://api:3000

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
